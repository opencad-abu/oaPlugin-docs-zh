<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background gradient: deep warm dark -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1210"/>
      <stop offset="100%" style="stop-color:#0f0c0b"/>
    </linearGradient>
    <!-- Text gradient: red-brown → dark red-brown -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#B4543A"/>
      <stop offset="100%" style="stop-color:#6E2A1B"/>
    </linearGradient>
    <!-- Accent line gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#B4543A;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#B4543A;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#6E2A1B;stop-opacity:0"/>
    </linearGradient>
    <!-- Glow -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded background -->
  <rect x="12" y="12" width="232" height="232" rx="48" ry="48" fill="url(#bg)" stroke="#2a1f1c" stroke-width="2"/>

  <!-- Subtle circuit traces -->
  <g opacity="0.08" stroke="#B4543A" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="44,76 64,76 72,84 72,100"/>
    <circle cx="72" cy="100" r="3" fill="#B4543A" stroke="none"/>
    <polyline points="212,180 192,180 184,172 184,156"/>
    <circle cx="184" cy="156" r="3" fill="#B4543A" stroke="none"/>
    <line x1="196" y1="56" x2="196" y2="72"/>
    <circle cx="196" cy="56" r="2.5" fill="#6E2A1B" stroke="none"/>
    <line x1="60" y1="200" x2="60" y2="184"/>
    <circle cx="60" cy="200" r="2.5" fill="#6E2A1B" stroke="none"/>
  </g>

  <!-- AIVI text -->
  <text x="128" y="148" text-anchor="middle"
        font-family="'SF Pro Display', 'Helvetica Neue', 'Segoe UI', 'Noto Sans', Arial, sans-serif"
        font-size="78" font-weight="700" letter-spacing="8"
        fill="url(#textGrad)" filter="url(#glow)">AIVI</text>

  <!-- Subtitle -->
  <text x="128" y="188" text-anchor="middle"
        font-family="'SF Pro Display', 'Helvetica Neue', 'Segoe UI', 'Noto Sans', Arial, sans-serif"
        font-size="13" font-weight="300" letter-spacing="8"
        fill="#555555">IC DESIGN</text>

  <!-- Accent line -->
  <rect x="92" y="64" width="72" height="2" rx="1" fill="url(#accentGrad)" opacity="0.4"/>
</svg>